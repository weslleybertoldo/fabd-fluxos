name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor
        run: pnpm mobile:sync

      - name: Atualiza versionName/versionCode no build.gradle
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          # versionCode precisa ser inteiro crescente — formula MMmmpp:
          # 1.9.0 -> 10900, 1.10.0 -> 11000, 2.0.0 -> 20000
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$VERSION_CODE" = "0" ]; then
            echo "ERROR: versionCode resolveu pra 0, abortando"
            exit 1
          fi
          echo "Versao: $VERSION (code $VERSION_CODE)"
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VERSION_CODE/" apps/mobile/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" apps/mobile/android/app/build.gradle
          grep -E "versionCode|versionName" apps/mobile/android/app/build.gradle | head -2

      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Building SIGNED RELEASE APK"
            echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/fabd-fluxos.keystore
            export KEYSTORE_FILE=fabd-fluxos.keystore
            cd apps/mobile/android && ./gradlew assembleRelease
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            echo "Building UNSIGNED DEBUG APK (no keystore secret found)"
            cd apps/mobile/android && ./gradlew assembleDebug
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          DST=app/build/outputs/apk/FABD-Fluxos-${{ steps.version.outputs.current }}.apk
          mv "$SRC" "$DST"
          echo "APK_PATH=apps/mobile/android/$DST" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_PATH }}
          retention-days: 7

  exe:
    name: Build .exe Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get version
        id: version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build .exe
        run: pnpm desktop:build

      - name: List dist contents
        shell: bash
        run: ls -la apps/desktop/dist/

      - name: Rename .exe (espacos -> hifens)
        shell: bash
        run: |
          cd apps/desktop/dist
          for f in *.exe; do
            new=$(echo "$f" | tr ' ' '-')
            [ "$f" != "$new" ] && mv "$f" "$new"
          done
          ls -la

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: apps/desktop/dist/FABD-Fluxos-Setup-${{ steps.version.outputs.current }}.exe
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [apk, exe]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: artifacts

      - name: Download .exe
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          name: v${{ needs.apk.outputs.version }}
          body: |
            ## FABD Fluxos v${{ needs.apk.outputs.version }}

            Build automatica via GitHub Actions a partir do commit ${{ github.sha }}.

            ### Downloads

            - **Android (APK)**: `FABD-Fluxos-${{ needs.apk.outputs.version }}.apk`
            - **Windows (.exe)**: `FABD-Fluxos-Setup-${{ needs.apk.outputs.version }}.exe`

            Para instalar como app no celular sem APK, use **Configuracoes > Atualizacoes > Baixar PWA**.
          files: |
            artifacts/FABD-Fluxos-${{ needs.apk.outputs.version }}.apk
            artifacts/FABD-Fluxos-Setup-${{ needs.apk.outputs.version }}.exe
          generate_release_notes: true
          make_latest: true

  bump:
    name: Bump version pra proxima
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump minor in all package.json
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEXT="$MAJOR.$NEW_MINOR.0"
          echo "Bumpando $CURRENT -> $NEXT"
          for f in package.json apps/web/package.json apps/desktop/package.json apps/mobile/package.json; do
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$f', 'utf8'));
              pkg.version = '$NEXT';
              fs.writeFileSync('$f', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Commit bump (com retry pra race condition)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json apps/desktop/package.json apps/mobile/package.json
          if git diff --staged --quiet; then
            echo "Sem mudancas pra commitar"
            exit 0
          fi
          git commit -m "chore: bump version pra proxima [skip ci]"
          # Retry push: se outro workflow ja pushou em paralelo, rebase + retry
          for attempt in 1 2 3; do
            if git push; then
              echo "Push OK na tentativa $attempt"
              exit 0
            fi
            echo "Push rejeitado na tentativa $attempt, fazendo pull --rebase"
            git pull --rebase origin main || true
          done
          echo "Falhou apos 3 tentativas — outro workflow concorrente venceu (provavelmente bumpou pra mesma versao). Nao eh blocker."
          exit 0
