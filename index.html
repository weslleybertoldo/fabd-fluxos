<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FABD Fluxos — em construcao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E3A8A 0%, #C41E2A 100%);
      color: #fff;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.5; opacity: 0.9; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .meta { font-size: 12px; opacity: 0.6; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FABD Fluxos</h1>
    <p>Gestao de demandas e processos da Federacao Alagoana de Badminton.</p>
    <p>Em construcao.</p>
    <div class="badge">Fase 0 — setup</div>
    <div class="meta">fluxos.fabd.com.br</div>
  </div>
</body>
</html>
